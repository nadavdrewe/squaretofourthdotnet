server {
    listen 443 ssl;
    server_name squaresap.store;
    ssl_certificate C:/wacs/certs/squaresap.store/squaresap.store-chain.pem;
    ssl_certificate_key C:/wacs/certs/squaresap.store/squaresap.store-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Which-Site squaresap always;
    location / {
        proxy_pass https://127.0.0.1:15041;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name squaretofourth.store;
        proxy_redirect https://$host:15041/ https://$host/;
        proxy_redirect https://localhost:15041/ https://$host/;
    }
}
